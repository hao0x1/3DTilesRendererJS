name: MOONDA app

on:
  push:
    paths: ['moonda/**', 'src/**', '.github/workflows/moonda.yml']
  pull_request:
    paths: ['moonda/**', 'src/**', '.github/workflows/moonda.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moonda
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: moonda/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: moonda/scripts/data-requirements.txt
      - run: python -m pip install -r scripts/data-requirements.txt
      - run: python scripts/test-data.py
